
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->
        <div class="left-section">

            <h2>TASK LIST</h2>

            <p class="info">
                Add tasks to your list by typing to the right
                and pressing enter. You may then view
                pending tasks below.
            </p>

            <div class="task-list" id="taskList">

                <p class="empty-message">
                    No tasks added yet!
                </p>

            </div>

        </div>


        <!-- RIGHT SECTION -->
        <div class="right-section">

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="I need to..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="addButton">
                    Add Task
                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
